{% extends "base.html" %}
{% block title %}{{ code }} · YtFin{% endblock %}
{% block body_class %}centered{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="card auth-card">
    <p class="eyebrow">Error {{ code }}</p>
    <h1>{{ name }}</h1>
    <p class="muted">{{ description }}</p>
    <a class="btn primary" href="{{ url_for('index') }}">Back to dashboard</a>
  </section>
  <button class="icon-btn floating" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme"></button>
</main>
{% endblock %}
