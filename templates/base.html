<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101010" />
  <title>{% block title %}YtFin{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300a4dc'/><path d='M12 9l12 7-12 7z' fill='white'/></svg>" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { if (localStorage.getItem("ytfin-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
